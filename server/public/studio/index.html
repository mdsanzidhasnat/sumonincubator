<html>
  <head>
    <title>Sumon Incubator · Admin</title>

    <meta content="width=device-width, initial-scale=1" name="viewport">
    <meta name="msapplication-TileColor" />
    <meta name="theme-color" content="#ffffff"/>
    <link rel="stylesheet" href="vendor/inter.css"/>
    <link rel="stylesheet" href="vendor/hind-siliguri.css"/>
    <link rel="stylesheet" href="theme-variables.css">
    <link rel="stylesheet" type="text/css" href="style.css"/>
    <link rel="stylesheet" href="vendor/prism.css"/>
    <link rel="stylesheet" href="tw.css">
    <link rel="stylesheet" href="dark-theme.css">
    <link rel="stylesheet" href="custom.css">
    <link rel="stylesheet" href="vanillatoasts/vanillatoasts.css">
    <link rel="stylesheet" href="vendor/leaflet.css"/>
    <link rel="icon" href="images/logo.svg" type="image/svg+xml">
    <script src="./config.js"></script>
    <script src="vendor/vue.global.prod.js"></script>
    <script src="vendor/vue-router.global.prod.js"></script>
    <script src="vendor/chart.umd.js"></script>
    <script src="vendor/leaflet.js"></script>
    <script src="vendor/codemirror.js"></script>
    <script src="vendor/codemirror-javascript.js"></script>
    <script>
      (function() {
        try {
          var key = 'studio-theme';
          var stored = localStorage.getItem(key);
          var prefersDark = typeof matchMedia !== 'undefined' && matchMedia('(prefers-color-scheme: dark)').matches;
          var isDark = stored === 'dark' || (!stored && prefersDark);
          if (!stored) localStorage.setItem(key, isDark ? 'dark' : 'light');
          if (isDark) document.documentElement.classList.add('dark');
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', isDark ? '#0f0f0f' : '#ffffff');
        } catch (err) {
          var prefersDark = typeof matchMedia !== 'undefined' && matchMedia('(prefers-color-scheme: dark)').matches;
          if (prefersDark) document.documentElement.classList.add('dark');
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', prefersDark ? '#0f0f0f' : '#ffffff');
        }
      })();
    </script>
  </head>

  <body>
    <div id="content"></div>

    <a id="add-product-fab" href="add-product.html"
       style="position:fixed;bottom:22px;right:22px;z-index:9998;display:flex;align-items:center;gap:8px;
              padding:12px 18px;border-radius:999px;background:#059669;color:#fff;text-decoration:none;
              font:600 14px/1 Inter, 'Hind Siliguri', sans-serif;box-shadow:0 6px 18px rgba(5,150,105,.35);
              transition:background .15s, transform .15s;"
       onmouseover="this.style.background='#047857';this.style.transform='translateY(-1px)'"
       onmouseout="this.style.background='#059669';this.style.transform='translateY(0)'">
      <span style="font-size:18px;line-height:1;">+</span> Add Product
    </a>

    <script src="vendor/prism.js" data-manual="true"></script>
    <script src="vendor/chart.umd.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
