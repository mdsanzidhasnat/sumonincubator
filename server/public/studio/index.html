<html>
  <head>
    <title>Sumon Incubator · Admin</title>

    <meta content="width=device-width, initial-scale=1" name="viewport">
    <meta name="msapplication-TileColor" />
    <meta name="theme-color" content="#ffffff"/>
    <link rel="stylesheet" href="vendor/inter.css"/>
    <link rel="stylesheet" href="vendor/hind-siliguri.css"/>
    <link rel="stylesheet" href="theme-variables.css">
    <link rel="stylesheet" type="text/css" href="style.css"/>
    <link rel="stylesheet" href="vendor/prism.css"/>
    <link rel="stylesheet" href="tw.css">
    <link rel="stylesheet" href="dark-theme.css">
    <link rel="stylesheet" href="custom.css">
    <link rel="stylesheet" href="vanillatoasts/vanillatoasts.css">
    <link rel="stylesheet" href="vendor/leaflet.css"/>
    <link rel="icon" href="images/logo.svg" type="image/svg+xml">
    <script src="./config.js"></script>
    <script src="vendor/vue.global.prod.js"></script>
    <script src="vendor/vue-router.global.prod.js"></script>
    <script src="vendor/chart.umd.js"></script>
    <script src="vendor/leaflet.js"></script>
    <script src="vendor/codemirror.js"></script>
    <script src="vendor/codemirror-javascript.js"></script>
    <script>
      (function() {
        try {
          var key = 'studio-theme';
          var stored = localStorage.getItem(key);
          var prefersDark = typeof matchMedia !== 'undefined' && matchMedia('(prefers-color-scheme: dark)').matches;
          var isDark = stored === 'dark' || (!stored && prefersDark);
          if (!stored) localStorage.setItem(key, isDark ? 'dark' : 'light');
          if (isDark) document.documentElement.classList.add('dark');
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', isDark ? '#0f0f0f' : '#ffffff');
        } catch (err) {
          var prefersDark = typeof matchMedia !== 'undefined' && matchMedia('(prefers-color-scheme: dark)').matches;
          if (prefersDark) document.documentElement.classList.add('dark');
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', prefersDark ? '#0f0f0f' : '#ffffff');
        }
      })();
    </script>
  </head>

  <body>
    <div id="content"></div>

    <a id="add-product-fab" href="add-product.html"
       style="position:fixed;bottom:22px;right:22px;z-index:9998;display:flex;align-items:center;gap:8px;
              padding:12px 18px;border-radius:999px;background:#059669;color:#fff;text-decoration:none;
              font:600 14px/1 Inter, 'Hind Siliguri', sans-serif;box-shadow:0 6px 18px rgba(5,150,105,.35);
              transition:background .15s, transform .15s;"
       onmouseover="this.style.background='#047857';this.style.transform='translateY(-1px)'"
       onmouseout="this.style.background='#059669';this.style.transform='translateY(0)'">
      <span style="font-size:18px;line-height:1;">+</span> Add Product
    </a>

    <script src="vendor/prism.js" data-manual="true"></script>
    <script src="vendor/chart.umd.js"></script>
    <script>
      (function () {
        try {
          var KNOWN = { category: 'Category', product: 'Product' };

          function fixHash() {
            var h = location.hash || '';
            if (!h) return;
            var m = h.match(/^#\/model\/([^/?]+)/);
            if (!m) return;
            var exact = KNOWN[m[1].toLowerCase()];
            if (exact && m[1] !== exact) {
              var fixed = h.replace(m[1], exact);
              if (history.replaceState) {
                history.replaceState(null, '', fixed);
              } else {
                location.hash = fixed;
              }
            }
          }

          function sanitizeModels(list) {
            return list
              .filter(function (m) { return typeof m === 'string'; })
              .map(function (m) { return KNOWN[m.toLowerCase()] || m; })
              .filter(function (m) { return KNOWN[m.toLowerCase()] !== undefined; });
          }

          function sanitizePages(list) {
            return list.map(function (entry) {
              if (entry && typeof entry.path === 'string') {
                entry.path = entry.path.replace(
                  /^\/model\/(category|product)(?=\/|$)/i,
                  function (_, name) { return '/model/' + KNOWN[name.toLowerCase()]; }
                );
              }
              return entry;
            });
          }

          function sanitizeStorage(key, fn) {
            var raw = localStorage.getItem(key);
            if (!raw) return;
            var parsed = JSON.parse(raw);
            if (Array.isArray(parsed)) {
              localStorage.setItem(key, JSON.stringify(fn(parsed)));
            }
          }

          fixHash();
          sanitizeStorage('studio:recently-viewed-models', sanitizeModels);
          sanitizeStorage('studio:recent-pages-history', sanitizePages);
        } catch (err) { /* ignore */ }
      })();
    </script>
    <script src="./app.js"></script>
    <script>
      (function () {
        var MARKER = 'sidebar-dashboard-link';

        function isDashboardActive() {
          return /dashboard\.html/.test(window.location.href);
        }

        function inject() {
          if (document.getElementById(MARKER)) return;
          var nav = document.querySelector('.models aside nav');
          if (!nav) return;

          var header = null;
          var labels = nav.querySelectorAll('div');
          for (var i = 0; i < labels.length; i++) {
            var text = (labels[i].textContent || '').trim();
            if (text.indexOf('All Models') === 0 || text.indexOf('Search Results') === 0) {
              header = labels[i];
              break;
            }
          }
          if (!header) return;
          var list = header.nextElementSibling;
          if (!list || list.tagName !== 'UL') return;
          if (list.querySelector('#' + MARKER)) return;

          var li = document.createElement('li');
          li.id = MARKER;
          var a = document.createElement('a');
          a.href = 'dashboard.html';
          a.className =
            'flex items-center rounded-md py-1.5 px-2 text-sm text-content-secondary' +
            (isDashboardActive() ? ' bg-gray-200 font-semibold text-content' : ' hover:bg-muted');
          a.textContent = 'Dashboard';
          li.appendChild(a);
          list.insertBefore(li, list.firstChild);
        }

        inject();
        new MutationObserver(inject).observe(document.body, { childList: true, subtree: true });
      })();
    </script>
  </body>
</html>
