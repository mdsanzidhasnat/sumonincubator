<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Dashboard · Sumon Incubator Admin</title>
    <link rel="stylesheet" href="vendor/inter.css" />
    <link rel="stylesheet" href="vendor/hind-siliguri.css" />
    <link rel="stylesheet" href="custom.css" />
    <link rel="stylesheet" href="sidebar.css" />
    <link rel="icon" href="images/logo.svg" type="image/svg+xml" />
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        background: var(--studio-bg-page, #f8fafc);
        color: var(--studio-text-primary, #0f172a);
        font-family: "Inter", "Hind Siliguri", system-ui, sans-serif;
      }
      main { max-width: 1024px; margin: 0 auto; padding: 24px 20px 96px; }
      .toolbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 16px; }
      .toolbar h1 { margin: 0; font-size: 20px; font-weight: 800; }
      .toolbar .sub { font-size: 13px; color: var(--studio-text-muted, #64748b); }
      button.refresh {
        padding: 8px 14px;
        font: inherit;
        font-size: 13px;
        font-weight: 700;
        color: var(--color-primary-text, #fff);
        background: var(--color-primary, #059669);
        border: none;
        border-radius: 8px;
        cursor: pointer;
        transition: background .15s, transform .15s;
      }
      button.refresh:hover { background: var(--color-primary-hover, #047857); }
      button.refresh:active { transform: translateY(1px); }
      button.refresh:disabled { opacity: .6; cursor: not-allowed; }
      .status { font-size: 13px; color: var(--studio-text-muted, #64748b); min-height: 18px; }
      .status.error { color: var(--studio-text-error, #b91c1c); font-weight: 600; }
      .kpis {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
        gap: 12px;
        margin-bottom: 16px;
      }
      .kpi {
        background: var(--studio-bg-surface, #fff);
        border: 1px solid var(--studio-border, #e2e8f0);
        border-radius: 12px;
        padding: 14px 16px;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .kpi .label { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: var(--studio-text-muted, #64748b); }
      .kpi .value { font-size: 26px; font-weight: 800; line-height: 1; }
      .kpi .value small { font-size: 14px; font-weight: 600; }
      .kpi.warn .value { color: var(--studio-text-warning, #b45309); }
      .kpi.danger .value { color: var(--studio-text-error, #b91c1c); }
      .kpi.ok .value { color: var(--studio-text-success, #15803d); }
      .card {
        background: var(--studio-bg-surface, #fff);
        border: 1px solid var(--studio-border, #e2e8f0);
        border-radius: 12px;
        padding: 20px;
        margin-bottom: 16px;
      }
      .card h2 {
        margin: 0 0 16px;
        font-size: 13px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: var(--studio-text-muted, #64748b);
      }
      .price-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
      .price-stat { text-align: center; }
      .price-stat .label { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: var(--studio-text-muted, #64748b); }
      .price-stat .value { font-size: 22px; font-weight: 800; margin-top: 4px; }
      .cat-row { display: grid; grid-template-columns: 140px 1fr 48px; align-items: center; gap: 10px; margin-bottom: 8px; }
      .cat-name { font-size: 13px; font-weight: 600; color: var(--studio-text-secondary, #334155); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .cat-bar { height: 10px; background: var(--studio-bg-muted, #f1f5f9); border-radius: 6px; overflow: hidden; }
      .cat-bar > div { height: 100%; background: linear-gradient(90deg, #059669, #34d399); border-radius: 6px; }
      .cat-count { text-align: right; font-size: 13px; font-weight: 700; }
      table { width: 100%; border-collapse: collapse; }
      th, td { text-align: left; padding: 9px 8px; font-size: 13px; border-bottom: 1px solid var(--studio-border, #e2e8f0); }
      th { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: var(--studio-text-muted, #64748b); }
      tr:last-child td { border-bottom: none; }
      td.title { font-weight: 600; }
      td.sku { font-family: ui-monospace, "Cascadia Code", monospace; font-size: 12px; color: var(--studio-text-muted, #64748b); }
      td.money { font-variant-numeric: tabular-nums; }
      .thumb { width: 34px; height: 34px; border-radius: 6px; object-fit: cover; background: var(--studio-bg-muted, #f1f5f9); }
      .pill { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 11px; font-weight: 700; }
      .pill.ok { background: var(--studio-bg-success, #f0fdf4); color: var(--studio-text-success, #15803d); }
      .pill.bad { background: var(--studio-bg-error, #fef2f2); color: var(--studio-text-error, #b91c1c); }
      .empty { padding: 24px; text-align: center; color: var(--studio-text-muted, #64748b); font-size: 14px; }
      .skeleton { display: grid; gap: 12px; }
      .skeleton .kpi { min-height: 78px; }
      @media (max-width: 560px) {
        .price-row { grid-template-columns: 1fr; }
        .cat-row { grid-template-columns: 110px 1fr 40px; }
        table thead { display: none; }
        table td { padding: 10px 4px; }
      }
    </style>
  </head>
  <body>
    <div id="si-sidebar-root"></div>

    <main>
      <div class="toolbar">
        <div>
          <h1>Catalog dashboard</h1>
          <div class="sub" id="updated"></div>
        </div>
        <button class="refresh" id="refreshBtn" type="button">Refresh</button>
      </div>
      <div class="status" id="status"></div>

      <section id="loading" class="skeleton" hidden>
        <div class="kpis">
          <div class="kpi"></div><div class="kpi"></div><div class="kpi"></div><div class="kpi"></div>
          <div class="kpi"></div><div class="kpi"></div><div class="kpi"></div><div class="kpi"></div>
        </div>
      </section>

      <section id="content" hidden>
        <div class="kpis" id="kpis"></div>

        <div class="card">
          <h2>Price (৳)</h2>
          <div class="price-row">
            <div class="price-stat"><div class="label">Lowest</div><div class="value" id="priceMin">—</div></div>
            <div class="price-stat"><div class="label">Average</div><div class="value" id="priceAvg">—</div></div>
            <div class="price-stat"><div class="label">Highest</div><div class="value" id="priceMax">—</div></div>
          </div>
        </div>

        <div class="card">
          <h2>Products per category</h2>
          <div id="categories" class="empty">No data</div>
        </div>

        <div class="card">
          <h2>Recently added</h2>
          <div id="recent"></div>
        </div>
      </section>
    </main>

    <script>
      const $ = (id) => document.getElementById(id);
      const statusEl = $('status');
      const content = $('content');
      const loading = $('loading');

      const fmt = (n, digits) =>
        Number(n).toLocaleString('en-US', { maximumFractionDigits: digits == null ? 0 : digits });
      const money = (n) => '\u09F3' + fmt(n, 2);
      const taka = (cents) => money(cents / 100);

      function pill(ok, text) {
        return '<span class="pill ' + (ok ? 'ok' : 'bad') + '">' + text + '</span>';
      }

      function renderKpis(totals) {
        const cards = [
          { label: 'Products', value: fmt(totals.products), cls: 'ok' },
          { label: 'Total stock', value: fmt(totals.stockQty), cls: '' },
          { label: 'Out of stock', value: fmt(totals.outOfStock), cls: totals.outOfStock ? 'danger' : 'ok' },
          { label: 'Low stock', value: fmt(totals.lowStock), cls: totals.lowStock ? 'warn' : 'ok' },
          { label: 'Bestsellers', value: fmt(totals.bestsellers), cls: '' },
          { label: 'Featured', value: fmt(totals.featured), cls: '' },
          { label: 'Avg rating', value: totals.avgRating.toFixed(1) + '<small>/5</small>', cls: '' },
          { label: 'Avg discount', value: fmt(totals.avgDiscountPct, 1) + '<small>%</small>', cls: '' },
        ];
        $('kpis').innerHTML = cards
          .map((c) => '<div class="kpi ' + c.cls + '"><span class="label">' + c.label + '</span><span class="value">' + c.value + '</span></div>')
          .join('');
      }

      function renderCategories(byCategory) {
        const el = $('categories');
        if (!byCategory.length) {
          el.className = 'empty';
          el.textContent = 'No data';
          return;
        }
        el.className = '';
        const max = Math.max.apply(null, byCategory.map((c) => c.count));
        el.innerHTML = byCategory
          .map((c) => {
            const pct = max ? Math.max(2, Math.round((c.count / max) * 100)) : 0;
            const bn = c.nameBn ? ' · ' + c.nameBn : '';
            return '<div class="cat-row"><div class="cat-name" title="' + c.name + bn + '">' + c.name + '</div>' +
              '<div class="cat-bar"><div style="width:' + pct + '%"></div></div>' +
              '<div class="cat-count">' + fmt(c.count) + '</div></div>';
          })
          .join('');
      }

      function renderRecent(recent) {
        const el = $('recent');
        if (!recent.length) {
          el.className = 'empty';
          el.textContent = 'No products yet';
          return;
        }
        el.className = '';
        const rows = recent.map((p) => {
          const img = p.image
            ? '<img class="thumb" src="' + p.image + '" alt="" />'
            : '<span class="thumb" style="display:inline-block"></span>';
          const added = new Date(p.createdAt).toLocaleDateString('en-GB', {
            day: '2-digit', month: 'short', year: 'numeric',
          });
          return '<tr>' +
            '<td>' + img + '</td>' +
            '<td class="title">' + p.title + '</td>' +
            '<td class="sku">' + p.sku + '</td>' +
            '<td class="money">' + money(p.price) + '</td>' +
            '<td>' + pill(p.stockQty > 0, p.stockQty > 0 ? fmt(p.stockQty) + ' in stock' : 'Out of stock') + '</td>' +
            '<td>' + added + '</td>' +
          '</tr>';
        }).join('');
        el.innerHTML = '<table><thead><tr>' +
          '<th></th><th>Title</th><th>SKU</th><th>Price</th><th>Stock</th><th>Added</th>' +
          '</tr></thead><tbody>' + rows + '</tbody></table>';
      }

      async function load() {
        const btn = $('refreshBtn');
        btn.disabled = true;
        statusEl.className = 'status';
        statusEl.textContent = 'Loading\u2026';
        content.hidden = true;
        loading.hidden = false;
        try {
          const res = await fetch('/api/v1/products/stats');
          const data = await res.json();
          if (!res.ok) {
            const msg = (data.error && data.error.message) || 'Request failed (' + res.status + ').';
            throw new Error(msg);
          }
          renderKpis(data.totals);
          renderCategories(data.byCategory);
          renderRecent(data.recent);
          $('priceMin').textContent = money(data.price.min);
          $('priceAvg').textContent = money(data.price.avg);
          $('priceMax').textContent = money(data.price.max);
          $('updated').textContent = 'Updated ' + new Date().toLocaleTimeString();
          content.hidden = false;
          statusEl.textContent = '';
        } catch (err) {
          statusEl.className = 'status error';
          statusEl.textContent = 'Could not load dashboard: ' + err.message;
        } finally {
          loading.hidden = true;
          btn.disabled = false;
        }
      }

      $('refreshBtn').addEventListener('click', load);
      load();
    </script>
    <script src="sidebar.js"></script>
  </body>
</html>
